- title: Research Experience
  type: time_table
  contents:
    - title: Doctoral Researcher
      institution: Nuclear Physics Group, University of Birmingham
      year: 2022 - 2026
      description:
        - title: AmBe simulation and characterisation
          contents:
            - Designed and validated a full Geant4 simulation of a <sup>241</sup>Am-<sup>9</sup>Be neutron source using an analytical <sup>9</sup>Be(&alpha;,n)<sup>12</sup>C primary generator, modelling detector response of HPGe, LiI and proportional counters against experimental measurements.
        - title: Detector simulation and analysis
          contents:
            - Detector response modelling and analysis for an array of 10 LaBr<sub>3</sub> detectors and two DSSD telescopes for gamma-ray coincidence measurements.
            - Implemented a MIDAS-to-ROOT data converter and a full ROOT/C++ analysis framework for DSSD telescope data, replacing the legacy SunSort analysis.
        - title: Digital acquisition system
          contents:
            - Designed and commissioned the digital DAQ system for the MC40 cyclotron at Birmingham - VME crate (4x CAEN V2745, V2740, V1730S) with a VME bridge to redundant Dell R360 data servers and a ZFS RAIDZ2 storage pool.
        - title: Detector electronics
          contents:
            - Designed a charge-sensitive preamplifier and shaping amplifier for PMT readout in a portable isotope-identification detector system.
        - title: Radioactive beam experiments
          contents:
            - <sup>7</sup>Be(d,p)<sup>8</sup>Be with the ISOLDE Solenoidal Spectrometer (ISS), CERN - acquisition and online monitoring.
            - <sup>9</sup>Li + boron in the TUDA-II chamber at ISAC-II, TRIUMF - detector operation, acquisition and online monitoring.

